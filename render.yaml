# ==============================================================================
# Renvue - Render Infrastructure as Code Blueprint
# Architecture: Option 2 (Isolated Web API + Background Worker + PostgreSQL + Valkey)
# Total Estimated Cost: ~$21/month (~$35.70 for 51 days / Nov 11 - Jan 1)
# ==============================================================================

databases:
  # Managed PostgreSQL for ACID recovery cases, audit trails, and LangGraph checkpointer
  - name: renvue-db
    databaseName: renvue
    user: renvue
    plan: basic-256mb # $7/mo - persistent, never sleeps, does not expire after 30 days
    region: oregon
    postgresMajorVersion: "16"

services:
  # ----------------------------------------------------------------------------
  # 1. Ephemeral Key-Value Store (Redis-compatible / Valkey)
  # Used for Taskiq recovery queue scheduling and SSE broadcast pub/sub
  # ----------------------------------------------------------------------------
  - type: keyvalue
    name: renvue-redis
    plan: free # $0/mo - 25 MB RAM, up to 50 connections
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # ----------------------------------------------------------------------------
  # 2. Core Backend API (FastAPI)
  # Dedicated 512 MB RAM / 0.5 CPU container. Handles webhook ingestion,
  # manual approvals, SSE streaming, and AG Grid data queries.
  # ----------------------------------------------------------------------------
  - type: web
    name: renvue-api
    runtime: python
    plan: starter # $7/mo
    region: oregon
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run python scripts/seed_diverse_cases.py && uv run uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: renvue-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: renvue-redis
          property: connectionString
      - key: PYTHONPATH
        value: src
      - key: DEMO_MODE
        value: "false"

      # --- Online Learning & Nightly Retrain Policy ---
      # Online empirical Bayes updates: ON; Nightly LightGBM retraining: OFF (candidate-only)
      - key: LEARNING_ENABLED
        value: "true"
      - key: RETRAIN_ENABLED
        value: "false"

      - key: FRONTEND_URL
        value: https://renvue-web.onrender.com
      - key: BACKEND_URL
        value: https://renvue-api.onrender.com

      # --- PayPal Sandbox Credentials (Required) ---
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_EMAIL
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false

      # --- Flexible Multi-Provider LLM (Use whatever is free: groq, gemini, mistral, openrouter, ollama) ---
      - key: LLM_PROVIDER
        sync: false # e.g. groq, gemini, mistral, openrouter
      - key: MODEL
        sync: false # optional common model override

      # Groq (Free Tier available: e.g. llama-3.3-70b-versatile)
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false

      # Google Gemini (Free Tier available: e.g. gemini-1.5-flash)
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false

      # Mistral AI
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        sync: false

      # OpenRouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false

      # Ollama / Cloud
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_MODEL
        sync: false
      - key: OLLAMA_API_KEY
        sync: false

      # --- Optional Communications Channels ---
      - key: RESEND_API_KEY
        sync: false
      - key: TWILO_ACCOUNT_SID
        sync: false
      - key: TWILO_AUTH_TOKEN
        sync: false
      - key: TWILO_WHATSAPP_NUMBER
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # 3. Background Taskiq Worker & Scheduler
  # Dedicated 512 MB RAM / 0.5 CPU container. Runs asynchronous recovery plays
  # and delayed abandoned-cart timers in complete isolation from the API.
  # ----------------------------------------------------------------------------
  - type: worker
    name: renvue-worker
    runtime: python
    plan: starter # $7/mo
    region: oregon
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen
    startCommand: ./scripts/start-worker.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: renvue-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: renvue-redis
          property: connectionString
      - key: PYTHONPATH
        value: src
      - key: DEMO_MODE
        value: "false"

      # --- Online Learning & Nightly Retrain Policy ---
      # Online empirical Bayes updates: ON; Nightly LightGBM retraining: OFF (candidate-only)
      - key: LEARNING_ENABLED
        value: "true"
      - key: RETRAIN_ENABLED
        value: "false"

      # --- PayPal Sandbox Credentials (Required) ---
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_EMAIL
        sync: false

      # --- Flexible Multi-Provider LLM (Use whatever is free: groq, gemini, mistral, openrouter, ollama) ---
      - key: LLM_PROVIDER
        sync: false
      - key: MODEL
        sync: false

      # Groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false

      # Google Gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false

      # Mistral AI
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        sync: false

      # OpenRouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false

      # Ollama / Cloud
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_MODEL
        sync: false
      - key: OLLAMA_API_KEY
        sync: false

      # --- Optional Communications Channels ---
      - key: RESEND_API_KEY
        sync: false
      - key: TWILO_ACCOUNT_SID
        sync: false
      - key: TWILO_AUTH_TOKEN
        sync: false
      - key: TWILO_WHATSAPP_NUMBER
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # 4. Frontend Single Page Application (Vite + React 19 + AG Grid)
  # Global CDN Static Site hosting with zero compute cost.
  # ----------------------------------------------------------------------------
  - type: web
    name: renvue-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://renvue-api.onrender.com/api
