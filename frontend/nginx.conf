server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Use Docker embedded DNS resolver for dynamic runtime resolution
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Proxy API and SSE to the backend container (same origin, so no CORS).
    location /api/ {
        set $backend_api "http://backend:8000";
        proxy_pass $backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Proxy webhooks
    location /webhooks/ {
        set $backend_api "http://backend:8000";
        proxy_pass $backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy backend health endpoint
    location /health {
        set $backend_api "http://backend:8000";
        proxy_pass $backend_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
