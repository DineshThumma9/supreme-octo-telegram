[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:uvicorn]
command=/bin/bash -c "cd /app/backend && exec uv run --no-sync uvicorn src.main:app --host 0.0.0.0 --port ${PORT:-8000}"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:taskiq]
command=/bin/bash -c "cd /app/backend && uv run --no-sync taskiq worker -d src background.worker:broker --workers 1"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:taskiq-scheduler]
command=/bin/bash -c "cd /app/backend && uv run --no-sync taskiq scheduler -d src background.worker:scheduler"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
